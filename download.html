            margin: 0;
            padding: 0;

        .main-layout {
            width: 100%;

        }

        .container {
            width: 100%;
            max-width: 800px;

            display: flex;
            flex-direction: column;
            align-items: center
        }

        .navbar {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-start;
            box-sizing: border-box;
            margin-bottom: 20px

        .logo {

            color: #fff;
            font-size: 1.2rem;
            text-decoration: none
        }

        .logo svg {
            width: 24px;
            height: 24px;
            color: #7b61ff
        }

        .download-card {
            background-color: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5)
        }

        .thumb-preview {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
            object-fit: cover;
            background-color: #05070a
        }

        .dl-title {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600
        }

        .btn-download-main {
            display: inline-block;
            background: linear-gradient(135deg, #7b61ff 0, #ff61a6 100%);
            color: #fff;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all .3s ease;
            box-shadow: 0 4px 15px rgba(123, 97, 255, .3);
            width: 80%
        }

        .btn-download-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 97, 255, .5)
        }

        .btn-download-main:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            transform: none
        }

        .progress-container {
            display: none;
            width: 100%;
            margin-top: 20px;
            text-align: center
        }

        .progress-bar-bg {
            background-color: rgba(255, 255, 255, .1);
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 10px
        }

        .progress-bar-fill {
            background: linear-gradient(135deg, #7b61ff 0, #ff61a6 100%);
            width: 0%;
            height: 100%;
            transition: width .1s linear
        }

        .progress-text {
            color: #8b949e;
            font-size: .95rem
        }

        .ad-container {
            width: 100%;
            min-height: 90px;
            margin: 20px 0;
            display: flex;
            justify-content: center
        }

        #dl-status-message {
            color: #8b949e;
            margin-top: 50px
        }
