<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <style>
        :root { --bg-color: #0d1117; --text-color: #c9d1d9; --primary: #888888; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: Inter, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 40px; border-radius: 10px; border: 1px solid #30363d; text-align: center; max-width: 500px; width: 90%; }
        h1 { margin-top: 0; color: #fff; }
        .btn-download { display: inline-block; padding: 12px 24px; background: #238636; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; transition: 0.2s; }
        .btn-download:hover { background: #2ea043; }
        #timer-text { color: #8b949e; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Menyiapkan Link...</h1>
        <p>Silakan tunggu beberapa saat, file Anda sedang disiapkan.</p>
        
        <div id="timer-text">Tautan unduhan akan muncul dalam <span id="countdown">5</span> detik...</div>
        
        <a id="final-download-btn" href="#" class="btn-download" style="display:none;" target="_blank">Unduh Video Sekarang</a>
        
        <br><br>
        <a href="index.html" style="color: #58a6ff; text-decoration: none; font-size: 0.9rem;">&larr; Kembali ke halaman utama</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileUrl = urlParams.get('file');
            
            if (fileUrl) {
                const downloadBtn = document.getElementById('final-download-btn');
                const timerText = document.getElementById('timer-text');
                const countdownEl = document.getElementById('countdown');
                
                downloadBtn.href = decodeURIComponent(fileUrl);
                
                let timeLeft = 5;
                const timer = setInterval(() => {
                    timeLeft--;
                    countdownEl.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        timerText.style.display = 'none';
                        downloadBtn.style.display = 'inline-block';
                        document.querySelector('h1').textContent = 'Link Siap!';
                        document.querySelector('p').textContent = 'Klik tombol di bawah ini untuk memulai unduhan.';
                    }
                }, 1000);
            } else {
                document.querySelector('.container').innerHTML = '<h1>Error</h1><p>Link unduhan tidak valid atau sudah kadaluarsa.</p><a href="index.html" style="color: #58a6ff; text-decoration: none;">Kembali</a>';
            }
        });
    </script>
</body>
</html>
